
        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Firebase Live Ledger</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>



   
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- HEADER & DATE FILTER -->
        <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm gap-4">
            <h1 class="text-xl font-bold text-gray-800">📊 Live Ledger Dashboard</h1>
            <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-gray-500">Select Date:</span>
                <input type="date" id="filterDate" class="border rounded-lg p-2 bg-white text-sm">
            </div>
        </div>

        <!-- CARD REPORTS (DASHBOARD) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-blue-600 text-white p-4 rounded-xl shadow-sm">
                <p class="text-sm opacity-80 font-medium">Total Base Entries</p>
                <h3 id="cardTotalEntries" class="text-2xl font-bold mt-1">0</h3>
            </div>
            <div class="bg-emerald-600 text-white p-4 rounded-xl shadow-sm">
                <p class="text-sm opacity-80 font-medium">Sum of Base Value</p>
                <h3 id="cardSumBase" class="text-2xl font-bold mt-1">0</h3>
            </div>
            <div class="bg-amber-600 text-white p-4 rounded-xl shadow-sm">
                <p class="text-sm opacity-80 font-medium">Sum of Live Values</p>
                <h3 id="cardSumLive" class="text-2xl font-bold mt-1">0</h3>
            </div>
        </div>

        <!-- FORM & TABLE STRUCTURE -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <form id="ledgerForm" class="flex flex-wrap gap-4 mb-6 p-4 bg-gray-50 rounded-lg items-end">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs font-bold text-gray-600 mb-1">Particulars / Item Name</label>
                    <input type="text" id="itemName" required class="w-full border rounded-lg p-2 bg-white text-sm">
                </div>
                <div class="w-40">
                    <label class="block text-xs font-bold text-gray-600 mb-1">Base Constant</label>
                    <input type="number" id="baseValue" required class="w-full border rounded-lg p-2 bg-white text-sm">
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg text-sm transition-all cursor-pointer">Save</button>
            </form>

            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="px-6 py-3 text-left">Particulars</th>
                        <th class="px-6 py-3 text-left">Base Constant</th>
                        <th class="px-6 py-3 text-left">Edit Live Value</th>
                        <th class="px-6 py-3 text-left">Remaining</th>
                        <th class="px-6 py-3 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100">
                    <tr><td colspan="5" class="px-6 py-4 text-center text-gray-400 italic">Select a date to fetch data.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
         // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyDPcVvNNJZRVGF9SESynXtsZYwdJXB7J8U",
    authDomain: "shemacc-3ccac.firebaseapp.com",
    databaseURL: "https://shemacc-3ccac-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shemacc-3ccac",
    storageBucket: "shemacc-3ccac.firebasestorage.app",
    messagingSenderId: "307019636811",
    appId: "1:307019636811:web:8f6ee756dbb7e756e8edce",
    measurementId: "G-TN1HZFMVSB"
  };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🌟 1. यह है वो मुख्य ग्लोबल कांस्टेंट वेरिएबल जिसमें सारा लाइव डेटा रहेगा
        let FIREBASE_LIVE_CONSTANT = {}; 

        const filterDate = document.getElementById('filterDate');
        const tableBody = document.getElementById('tableBody');
        filterDate.value = new Date().toISOString().split('T');

        // --- FORM SUBMIT (SAVE DATA) ---
        document.getElementById('ledgerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            push(ref(db, 'reports/' + filterDate.value), {
                name: document.getElementById('itemName').value,
                firebaseValue: Number(document.getElementById('baseValue').value)
            }).then(() => document.getElementById('ledgerForm').reset());
        });

        // --- 2. FIREBASE से डेटा लाकर CONSTANT में डालना ---
        function startLiveSync() {
            onValue(ref(db, 'reports/' + filterDate.value), (snapshot) => {
                // सारा डेटा हमारे ग्लोबल वेरिएबल में सेव हो गया
                FIREBASE_LIVE_CONSTANT = snapshot.val() || {}; 
                
                // अब इसी कांस्टेंट वेरिएबल से टेबल और कार्ड दोनों रिपोर्ट जनरेट करेंगे
                renderTableAndCards();
            });
        }

        // --- 3. CONSTANT वेरिएबल से TABLE और CARD REPORT बनाना ---
        function renderTableAndCards() {
            tableBody.innerHTML = '';
            let rowsHtml = '';
            
            // कार्ड रिपोर्ट्स के वेरिएबल्स
            let totalEntries = 0;
            let sumBase = 0;
            let sumLive = 0;

            const keys = Object.keys(FIREBASE_LIVE_CONSTANT);
            totalEntries = keys.length;

            if (totalEntries === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-400 italic">No records found.</td></tr>`;
            } else {
                keys.forEach((id) => {
                    const item = FIREBASE_LIVE_CONSTANT[id];
                    sumBase += item.firebaseValue;
                    sumLive += item.firebaseValue; // डिफ़ॉल्ट रूप से लाइव वैल्यू भी बेस के बराबर होगी

                    rowsHtml += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-semibold text-gray-900">${item.name}</td>
                            <td class="px-6 py-4 font-bold text-blue-600">${item.firebaseValue}</td>
                            <td class="px-6 py-4">
                                <input type="number" value="${item.firebaseValue}" id="input-${id}" 
                                    class="border rounded-lg p-1 w-24 text-center focus:ring-2 focus:ring-blue-400 bg-white" 
                                    oninput="window.uiCalculate('${id}', ${item.firebaseValue})">
                            </td>
                            <td class="px-6 py-4 font-bold text-amber-600" id="rem-${id}">0</td>
                            <td class="px-6 py-4 text-center">
                                <button onclick="window.saveRemaining('${id}', ${item.firebaseValue})" 
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1 px-3 rounded shadow text-xs cursor-pointer">
                                    Update Base
                                </button>
                            </td>
                        </tr>`;
                });
                tableBody.innerHTML = rowsHtml;
                
                // स्क्रीन लोड होते ही शुरूआती माइनस (0) सेट करना
                keys.forEach(id => window.uiCalculate(id, FIREBASE_LIVE_CONSTANT[id].firebaseValue));
            }

            // कार्ड रिपोर्ट्स (UI Metrics) को अपडेट करना
            document.getElementById('cardTotalEntries').innerText = totalEntries;
            document.getElementById('cardSumBase').innerText = sumBase;
            document.getElementById('cardSumLive').innerText = sumLive;
        }

        // --- 4. लाइव टाइप करते समय माइनस कैलकुलेशन और कार्ड लाइव सम अपडेट ---
        window.uiCalculate = function(id, fbVal) {
            const inputVal = Number(document.getElementById(`input-${id}`).value) || 0;
            document.getElementById(`rem-${id}`).innerText = fbVal - inputVal;

            // टाइप करते ही लाइव सम वाले कार्ड को तुरंत अपडेट करना
            let currentLiveTotal = 0;
            Object.keys(FIREBASE_LIVE_CONSTANT).forEach(key => {
                const el = document.getElementById(`input-${key}`);
                currentLiveTotal += el ? (Number(el.value) || 0) : 0;
            });
            document.getElementById('cardSumLive').innerText = currentLiveTotal;
        };

        // --- 5. माइनस वैल्यू को वापस FIREBASE में सेव करना ---
        window.saveRemaining = function(id, fbVal) {
            const inputVal = Number(document.getElementById(`input-${id}`).value) || 0;
            const remaining = fbVal - inputVal;

            update(ref(db, `reports/${filterDate.value}/${id}`), {
                firebaseValue: remaining
            });
        };

        filterDate.addEventListener('change', startLiveSync);
        startLiveSync(); // फर्स्ट टाइम रन
    </script>
</body>
</html>
